name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Versao a partir da tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release -p:Version="$PACKAGE_VERSION"

      - run: dotnet test --no-build -c Release

      - run: dotnet pack src/Fcg.Contracts --no-build -c Release -o artifacts -p:Version="$PACKAGE_VERSION"

      - name: Login no nuget.org (Trusted Publishing / OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: sampaiobrenner

      - name: Publicar no nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
